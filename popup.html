<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <title>Tab Manager</title>
    <style>
        body { font-family: Arial, sans-serif; width: 350px; padding: 10px; }
        textarea { width: 100%; height: 100px; box-sizing: border-box; }
        button { width: 100%; margin-top: 10px; padding: 5px; }
        .mode-switcher { display: flex; margin-bottom: 15px; }
        .mode-switcher button { flex: 1; margin: 0 2px; }
        .mode-switcher button.active { background-color: #4CAF50; color: white; }
        .mode-content { display: none; }
        .mode-content.active { display: block; }
        #stats { margin-top: 10px; padding: 10px; background: #f0f0f0; border-radius: 5px; font-size: 12px; }
        .stat-item { margin: 3px 0; }

        /* Modal styles */
        .modal-overlay {
            display: none;
            position: fixed;
            top: 0;
            left: 0;
            right: 0;
            bottom: 0;
            background: rgba(0, 0, 0, 0.6);
            z-index: 1000;
            align-items: center;
            justify-content: center;
        }
        .modal-overlay.active { display: flex; }
        .modal-content {
            background: white;
            padding: 20px;
            border-radius: 8px;
            box-shadow: 0 4px 6px rgba(0, 0, 0, 0.3);
            max-width: 300px;
            text-align: center;
        }
        .modal-message { margin-bottom: 20px; font-size: 14px; }
        .modal-buttons { display: flex; gap: 10px; justify-content: center; }
        .modal-buttons button {
            width: auto;
            padding: 8px 20px;
            margin: 0;
            cursor: pointer;
            border: none;
            border-radius: 4px;
        }
        .modal-btn-confirm { background-color: #f44336; color: white; }
        .modal-btn-confirm:hover { background-color: #da190b; }
        .modal-btn-cancel { background-color: #ddd; color: #333; }
        .modal-btn-cancel:hover { background-color: #ccc; }
    </style>
</head>
<body>
<div class="mode-switcher">
    <button id="openerMode" class="active">Opener</button>
    <button id="closerMode">Closer</button>
</div>

<div id="openerContent" class="mode-content active">
    <h2>Delayed Tab Opener</h2>
    <h3>Enter Links (one per line)</h3>
    <textarea id="links"></textarea>
    <label for="delay">Delay (seconds):</label>
    <input type="number" id="delay" value="3" min="1">
    <label>
        <input type="checkbox" id="waitForLoad">
        Wait for full page load before opening next tab
    </label>
    <button id="start">Open Tabs</button>
    <button id="stop">Stop</button>
    <p id="remaining">Remaining links: 0</p>
    <p id="time">Time remaining: 0s</p>
</div>

<div id="closerContent" class="mode-content">
    <h2>Tab Closer</h2>
    <h3>Rules (one per line)</h3>
    <p style="font-size: 11px; margin: 5px 0;">Format: <code>url --- text</code> or <code>--- text</code> (all pages)</p>
    <textarea id="closerRules" rows="8"></textarea>
    <button id="checkRules">Check</button>
    <button id="closeRules">Close Tabs</button>
    <div id="stats"></div>
</div>

<!-- Confirmation Modal -->
<div id="confirmModal" class="modal-overlay">
    <div class="modal-content">
        <div class="modal-message" id="modalMessage"></div>
        <div class="modal-buttons">
            <button id="modalConfirm" class="modal-btn-confirm">Yes</button>
            <button id="modalCancel" class="modal-btn-cancel">Cancel</button>
        </div>
    </div>
</div>

<script src="popup.js"></script>
</body>
</html>
